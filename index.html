<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Butterfly Discovery Atlas</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="globe-canvas" aria-label="蝴蝶发现地球仪"></canvas>

    <main class="interface-shell">
      <section class="masthead" aria-label="Atlas status">
        <div>
          <p class="eyebrow">Butterfly Discovery Atlas</p>
          <h1>蝴蝶发现地球仪</h1>
        </div>
        <div class="dataset-status" id="dataset-status">正在读取数据</div>
      </section>

      <section class="metrics-bar" aria-label="Dataset metrics">
        <div>
          <span id="species-count">0</span>
          <small>已核查标记</small>
        </div>
        <div>
          <span id="precision-count">0</span>
          <small>降级坐标</small>
        </div>
        <div>
          <span id="hover-label">全球概览</span>
          <small>当前焦点</small>
        </div>
      </section>

      <nav class="species-tray" id="species-tray" aria-label="Species markers"></nav>

      <aside class="specimen-panel" id="specimen-panel" aria-live="polite">
        <div class="specimen-heading">
          <p>标本标签</p>
          <button class="close-panel" id="close-panel" type="button" aria-label="关闭标本标签">×</button>
        </div>
        <div class="empty-label">
          <strong>10 条正式 seed 标记</strong>
          <span>从冻结数据口径读取；当前为全球概览。</span>
        </div>
      </aside>
    </main>

    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
